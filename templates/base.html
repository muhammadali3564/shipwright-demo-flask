<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Shipwright Demo{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0f172a !important; color: #e2e8f0 !important; min-height: 100vh; }
    .navbar { background: #1e293b !important; border-bottom: 1px solid #334155; }
    .card { background: #1e293b !important; border: 1px solid #334155 !important; color: #e2e8f0 !important; }
    .card * { color: #e2e8f0; }
    .card p, .card li, .card h1, .card h2, .card h3, .card h4, .card h5 { color: #e2e8f0 !important; }
    .text-muted { color: #94a3b8 !important; }
    h1, h2, h3, h4, h5, h6, p, ul, ol, li, span, div { color: inherit; }
    main h1, main h2, main h3, main h4 { color: #f1f5f9 !important; }
    .form-control { background: #0f172a !important; color: #e2e8f0 !important; border-color: #334155 !important; }
    .form-control:focus { background: #0f172a !important; color: #e2e8f0 !important; border-color: #3b82f6 !important; box-shadow: 0 0 0 0.2rem rgba(59,130,246,0.25) !important; }
    .form-control::placeholder { color: #64748b !important; }
    .form-label { color: #e2e8f0 !important; }
    .btn-primary { background: #3b82f6; border-color: #3b82f6; }
    .btn-outline-light { color: #e2e8f0; border-color: #e2e8f0; }
    .hero { padding: 100px 0; text-align: center; }
    .hero h1 { font-size: 3.5rem; font-weight: 800; }
    .badge-shipwright { background: #3b82f6; color: white !important; }
    a { color: #60a5fa; }
    hr.border-secondary { border-color: #334155 !important; }
    .alert-success { background: #064e3b !important; color: #d1fae5 !important; border-color: #065f46 !important; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">
        <span class="badge badge-shipwright me-2">SW</span> Shipwright Demo
      </a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
          <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  <footer class="text-center py-4 mt-5 border-top border-secondary" style="color:#94a3b8;">
    <small>Deployed by Shipwright &middot; AI-Powered Deployment Platform</small>
  </footer>
</body>
</html>
