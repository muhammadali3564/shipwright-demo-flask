<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Shipwright Demo{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    .navbar { background: #1e293b !important; border-bottom: 1px solid #334155; }
    .card { background: #1e293b; border: 1px solid #334155; }
    .form-control, .form-control:focus { background: #0f172a; color: #e2e8f0; border-color: #334155; }
    .form-control::placeholder { color: #64748b; }
    .btn-primary { background: #3b82f6; border-color: #3b82f6; }
    .hero { padding: 100px 0; text-align: center; }
    .hero h1 { font-size: 3.5rem; font-weight: 800; }
    .badge-shipwright { background: #3b82f6; }
    a { color: #60a5fa; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">
        <span class="badge badge-shipwright me-2">SW</span> Shipwright Demo
      </a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
          <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  <footer class="text-center text-muted py-4 mt-5 border-top border-secondary">
    <small>Deployed by Shipwright &middot; AI-Powered Deployment Platform</small>
  </footer>
</body>
</html>
